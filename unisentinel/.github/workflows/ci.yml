name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Prevent committing .env into unisentinel build context
        run: |
          echo "Checking for accidental .env files in unisentinel/..."
          if [ -e unisentinel/.env ] || [ -e unisentinel/.env.local ] || ls unisentinel/.env* 1> /dev/null 2>&1; then
            echo "ERROR: Found one or more .env files inside the unisentinel/ build context.\nFor security, do NOT commit .env files. Remove them or add them to unisentinel/.dockerignore and re-run.";
            ls -la unisentinel | sed -n '1,200p'
            exit 1
          fi
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint || true
      - name: Audit dependencies (npm audit)
        run: |
          echo "Running npm audit (non-failing for CI)";
          npm audit --audit-level=moderate || true
      - name: Build Docker image (CI smoke build)
        run: |
          echo "Building Docker image for unisentinel";
          docker build -t unisentinel:ci -f unisentinel/Dockerfile unisentinel || true
