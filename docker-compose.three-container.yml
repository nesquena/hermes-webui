version: '3.8'

services:
  hermes-webui:
    image: hermes-webui
    ports:
      - "8787:8787"
      - "9119:9119"
    environment:
      - HERMES_DASHBOARD_PORT=9119
    depends_on:
      - hermes-agent

  hermes-agent:
    image: hermes-agent
    ports:
      - "9119:9119"
    environment:
      - HERMES_DASHBOARD_PORT=9119

  redis:
    image: redis
    ports:
      - "6379:6379"
