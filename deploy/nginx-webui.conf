# nginx reverse proxy for Hermes WebUI with PAM authentication.
#
# Prerequisites:
#   - nginx built with ngx_http_auth_pam_module
#     (Debian/Ubuntu: package nginx-extra or build with --with-http_auth_pam_module)
#   - A PAM service file at /etc/pam.d/webui-auth (see deploy/webui-auth.pam)
#   - System user accounts created with passwords
#     (e.g. `sudo useradd -m -s /bin/bash deployer` then `sudo passwd deployer`;
#     `useradd` alone leaves the account locked and pam_unix cannot log it in)
#   - nginx workers running as root (`user root;` in /etc/nginx/nginx.conf):
#     pam_unix can only verify other users' passwords when the worker can
#     read /etc/shadow — a www-data worker is rejected by unix_chkpwd.
#     See deploy/README.md step 3b and Security notes.
#
# Adjust: external port, server_name, TLS cert paths, and backend port
#         (default: nginx:8787 -> backend:8788 on 127.0.0.1)

# Upstream: loopback-only backend on port 8788
upstream hermes_webui {
    server 127.0.0.1:8788;
}

# WebSocket upgrade map. This must be defined once in the http {} context —
# this file is included from sites-enabled (inside http {}), so keep it
# uncommented here. Without it, nginx fails at `nginx -t` with an
# unknown-variable error for $connection_upgrade below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8787 ssl;
    server_name ut189103.duckdns.org;

    # --- TLS (replace with your cert paths) ---
    ssl_certificate     /etc/ssl/certs/webui.pem;
    ssl_certificate_key /etc/ssl/private/webui.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Proxy-level authentication (PAM via ngx_http_auth_pam_module) ---
    # PAM service defined at /etc/pam.d/webui-auth
    auth_pam           "Restricted";
    auth_pam_service_name "webui-auth";

    # --- Reverse proxy to loopback backend ---
    location / {
        # PAM auth is handled at the proxy level — the WebUI auth gate
        # is intentionally NOT engaged (no HERMES_WEBUI_PASSWORD set).

        # Rewrite Host to 127.0.0.1 so the loopback-bound WebUI accepts it.
        # The backend's CSRF/origin check compares the browser Origin
        # (https://<server_name>:8787) against the Host it sees, so the
        # systemd unit sets HERMES_WEBUI_ALLOWED_ORIGINS to the external
        # origin — without it, browser writes are rejected with 403.
        proxy_set_header Host              127.0.0.1;

        # Preserve original host / proto / real client IP for the app.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://hermes_webui;
        proxy_read_timeout 300s;

        # Uploads: nginx's default client_max_body_size is 1m, but the
        # WebUI accepts up to HERMES_WEBUI_MAX_UPLOAD_MB (default 20).
        # Match it, or ordinary attachments die with 413 at the proxy
        # before reaching the backend. Raise both together if you
        # increase the backend limit.
        client_max_body_size 20m;
    }
}
