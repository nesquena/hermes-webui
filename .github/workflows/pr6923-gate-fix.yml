name: PR 6923 gate fix

on:
  push:
    branches:
      - fix/media-token-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply PR 6923 gate fix v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/media-token-boundaries

      - name: Apply gate fixes and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Streaming completion must be decided from the raw parser capture.
          replace_once(
              "static/messages.js",
              """      const parts=typeof _mediaTokenParts==='function'?_smdMediaTokenParts(combined,m.index,m[1],parent):null;\n      const hasDetachedSuffix=!!(parts&&parts[1]);\n      if(matchEnd===combined.length && !hasDetachedSuffix && !_smdMediaRefHasReliableBoundary(parts?parts[0]:m[1])){\n""",
              """      const parts=typeof _mediaTokenParts==='function'?_smdMediaTokenParts(combined,m.index,m[1],parent):null;\n      // Buffering is decided from the raw parser capture. A detached punctuation\n      // suffix can be only an intermediate parser boundary (for example the dot\n      // in /tmp/a.png), so it must not make a partial ref look complete.\n      if(matchEnd===combined.length && !_smdMediaRefHasReliableBoundary(m[1])){\n""",
          )

          # 2) Delimiter-only refs are valid unless matching wrapper syntax was consumed.
          replace_once(
              "static/ui.js",
              """  let ref=String(rawRef||'');\n  let suffix='';\n  const before=String(source||'').slice(0,Number(matchOffset)||0);\n""",
              """  let ref=String(rawRef||'');\n  let suffix='';\n  let consumedWrapper=false;\n  const before=String(source||'').slice(0,Number(matchOffset)||0);\n""",
          )
          replace_once(
              "static/ui.js",
              """    ref=ref.slice(0,closeAt);\n    suffix=family.value+afterQuote;\n    break;\n""",
              """    ref=ref.slice(0,closeAt);\n    suffix=family.value+afterQuote;\n    consumedWrapper=true;\n    break;\n""",
          )
          replace_once(
              "static/ui.js",
              """      ref=candidate.slice(0,-delimiter.length);\n      suffix=delimiter+afterDelimiter;\n      break;\n""",
              """      ref=candidate.slice(0,-delimiter.length);\n      suffix=delimiter+afterDelimiter;\n      consumedWrapper=true;\n      break;\n""",
          )
          replace_once(
              "static/ui.js",
              """  if(!ref||/^[*_`]+$/.test(ref)) return null;\n""",
              """  if(!ref||(consumedWrapper&&/^[*_`]+$/.test(ref))) return null;\n""",
          )

          replace_once(
              "api/helpers.py",
              """    ref = str(match.group(1) or \"\")\n    suffix = \"\"\n    before = str(text or \"\")[: match.start()]\n""",
              """    ref = str(match.group(1) or \"\")\n    suffix = \"\"\n    consumed_wrapper = False\n    before = str(text or \"\")[: match.start()]\n""",
          )
          replace_once(
              "api/helpers.py",
              """        ref = ref[:close_at]\n        suffix = value + after_quote\n        break\n""",
              """        ref = ref[:close_at]\n        suffix = value + after_quote\n        consumed_wrapper = True\n        break\n""",
          )
          replace_once(
              "api/helpers.py",
              """            ref = candidate[: -len(delimiter)]\n            suffix = delimiter + after_delimiter + suffix\n            break\n""",
              """            ref = candidate[: -len(delimiter)]\n            suffix = delimiter + after_delimiter + suffix\n            consumed_wrapper = True\n            break\n""",
          )
          replace_once(
              "api/helpers.py",
              """    if not ref or _re.fullmatch(r\"[*_`]+\", ref):\n        return None\n""",
              """    if not ref or (consumed_wrapper and _re.fullmatch(r\"[*_`]+\", ref)):\n        return None\n""",
          )

          # Real SMD harness: exercise safe, fade and reduced-motion rendering.
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '        "globalThis.window = { smd };\\n"\n',
              '        "globalThis.window = { smd, matchMedia: () => ({ matches:false, addEventListener:()=>{}, removeEventListener:()=>{}, addListener:()=>{}, removeListener:()=>{} }) };\\n"\n',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '        "  const root=document.createElement(\'div\');\\n"\n        "  const baseRenderer=mode===\'fade\' ? _streamFadeRenderer(root) : _safeSmdRenderer(root);\\n"\n',
              '        "  const root=document.createElement(\'div\');\\n"\n        "  _streamFadeReduceMotionMql = null;\\n"\n        "  _streamFadeReduceMotion = false;\\n"\n        "  window.matchMedia = () => ({ matches:mode===\'reduced\', addEventListener:()=>{}, removeEventListener:()=>{}, addListener:()=>{}, removeListener:()=>{} });\\n"\n        "  const baseRenderer=mode===\'safe\' ? _safeSmdRenderer(root) : _streamFadeRenderer(root);\\n"\n',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '        "function renderModes(chunks){ return { safe: renderChunks(chunks, \'safe\'), fade: renderChunks(chunks, \'fade\') }; }\\n"\n',
              '        "function renderModes(chunks){ return { safe: renderChunks(chunks, \'safe\'), fade: renderChunks(chunks, \'fade\'), reduced: renderChunks(chunks, \'reduced\') }; }\\n"\n',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '        "const refSplit=renderModes([\'MEDIA:C:/tmp/li\', \'ve.png \']);\\n"\n        "const finalExtensionless=renderModes([\'MEDIA:https://fal.media/generated\']);\\n"\n',
              '        "const refSplit=renderModes([\'MEDIA:C:/tmp/li\', \'ve.png \']);\\n"\n        "const boundarySweeps={};\\n"\n        "for(const [name,source] of Object.entries({local:\'MEDIA:/tmp/a.png \', emphasis:\'**MEDIA:/tmp/a.png** \', windows:\'MEDIA:C:\\\\\\\\Temp\\\\\\\\a.png \', remote:\'MEDIA:https://example.com/a.png \'})){\\n"\n        "  const settled=renderModes([source]); const splits={};\\n"\n        "  for(let i=1;i<source.length;i++) splits[i]=renderModes([source.slice(0,i), source.slice(i)]);\\n"\n        "  boundarySweeps[name]={settled,splits};\\n"\n        "}\\n"\n        "const finalExtensionless=renderModes([\'MEDIA:https://fal.media/generated\']);\\n"\n',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '        "console.log(JSON.stringify({prefixSplits, refSplit, finalExtensionless, pdf, falsePrefix, crossParent, boundaries, punctuation, remoteSuffixPunctuation}));\\n"\n',
              '        "console.log(JSON.stringify({prefixSplits, refSplit, boundarySweeps, finalExtensionless, pdf, falsePrefix, crossParent, boundaries, punctuation, remoteSuffixPunctuation}));\\n"\n',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              '''        self.assertIn("const hasDetachedSuffix=", block)\n        self.assertIn("!hasDetachedSuffix", block)\n        self.assertIn("!_smdMediaRefHasReliableBoundary(parts?parts[0]:m[1])", block)\n''',
              '''        self.assertNotIn("const hasDetachedSuffix=", block)\n        self.assertIn("!_smdMediaRefHasReliableBoundary(m[1])", block)\n''',
          )
          replace_once(
              "tests/test_smd_media_in_stream.py",
              """    def test_real_smd_parser_flushes_final_extensionless_url(self):\n""",
              """    def test_real_smd_parser_all_byte_boundaries_match_settled_output(self):\n        for shape, sweep in self.cases[\"boundarySweeps\"].items():\n            for split, modes in sweep[\"splits\"].items():\n                for mode, result in modes.items():\n                    with self.subTest(shape=shape, split=split, mode=mode):\n                        settled = sweep[\"settled\"][mode]\n                        self.assertEqual(result[\"html\"], settled[\"html\"])\n                        self.assertEqual(result[\"text\"], settled[\"text\"])\n\n    def test_real_smd_parser_flushes_final_extensionless_url(self):\n""",
          )

          # Cross-consumer exact-path coverage for unmatched delimiter filenames.
          p = Path("tests/test_media_token_consumer_parity.py")
          text = p.read_text(encoding="utf-8")
          marker = "test_unmatched_delimiter_only_ref_remains_exact_in_renderer_and_server_splitter"
          if marker in text:
              raise SystemExit("delimiter-only regression tests already present")
          text = text.rstrip() + r'''


@pytest.mark.parametrize(
    ("ref", "encoded_ref"),
    [("_", "_"), ("__", "__"), ("*", "*"), ("`", "%60")],
)
def test_unmatched_delimiter_only_ref_remains_exact_in_renderer_and_server_splitter(
    media_parity_driver, ref, encoded_ref
):
    from api.helpers import split_media_token_ref

    text = f"MEDIA:{ref}"
    match = re.search(r"MEDIA:([^\s\)\]]+)", text)
    assert match is not None
    assert split_media_token_ref(text, match) == (ref, "")

    rendered = _render(media_parity_driver, text)
    assert f"api/media?path={encoded_ref}" in rendered
    assert "MEDIA:" not in rendered


@pytest.mark.parametrize("text", ["_MEDIA:__", "*MEDIA:**", "`MEDIA:``"])
def test_matching_wrapper_with_delimiter_only_payload_stays_literal(
    media_parity_driver, text
):
    from api.helpers import split_media_token_ref

    match = re.search(r"MEDIA:([^\s\)\]]+)", text)
    assert match is not None
    assert split_media_token_ref(text, match) is None
    rendered = _render(media_parity_driver, text)
    assert "api/media?path=" not in rendered
''' + "\n"
          p.write_text(text, encoding="utf-8")
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          node --check static/messages.js
          node --check static/ui.js
          python3 -m py_compile api/helpers.py tests/test_smd_media_in_stream.py tests/test_media_token_consumer_parity.py
          git diff --check
          grep -F '!_smdMediaRefHasReliableBoundary(m[1])' static/messages.js
          ! grep -F 'const hasDetachedSuffix=' static/messages.js
          grep -F 'consumedWrapper&&/^[*_`]+$/' static/ui.js
          grep -F 'consumed_wrapper and _re.fullmatch' api/helpers.py

      - name: Commit and push corrected head
        shell: bash
        run: |
          rm .github/workflows/pr6923-gate-fix.yml
          git config user.name 'pxxD1998'
          git config user.email '214340659+pxxD1998@users.noreply.github.com'
          git add static/messages.js static/ui.js api/helpers.py tests/test_smd_media_in_stream.py tests/test_media_token_consumer_parity.py .github/workflows/pr6923-gate-fix.yml
          git commit -m 'fix(renderer): preserve MEDIA refs across parser boundaries'
          git push origin HEAD:fix/media-token-boundaries
