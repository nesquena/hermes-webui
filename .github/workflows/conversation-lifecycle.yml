name: Conversation lifecycle (informational)

# Scoped to the code this browser gate actually exercises — the chat
# render/streaming surface — so it doesn't spin up playwright+chromium on
# docs-only or unrelated changes. If none of these paths change, the run is
# skipped entirely (GitHub treats a path-filtered no-match as "not triggered").
on:
  pull_request:
    branches: [master]
    paths:
      - 'static/**'
      - 'api/**.py'
      - 'server.py'
      - 'tests/browser_conversation_lifecycle.py'
      - 'tests/sidebar_terminal_barrier_server.py'
      - 'tests/browser_historical_transcript_hydration.py'
      - 'tests/browser_virtual_transcript_anchor.py'
      - 'tests/browser_reconnect_scene_redraw.py'
      - 'tests/browser_settle_visibility_7676.py'
      - 'tests/browser_approval_first_click.py'
      - 'tests/browser_live_scene_energy.py'
      - 'tests/browser_progress_animation.py'
      - 'tests/browser_running_ring_inset.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/conversation-lifecycle.yml'
  push:
    branches: [master]
    paths:
      - 'static/**'
      - 'api/**.py'
      - 'server.py'
      - 'tests/browser_conversation_lifecycle.py'
      - 'tests/sidebar_terminal_barrier_server.py'
      - 'tests/browser_historical_transcript_hydration.py'
      - 'tests/browser_virtual_transcript_anchor.py'
      - 'tests/browser_reconnect_scene_redraw.py'
      - 'tests/browser_settle_visibility_7676.py'
      - 'tests/browser_approval_first_click.py'
      - 'tests/browser_live_scene_energy.py'
      - 'tests/browser_progress_animation.py'
      - 'tests/browser_running_ring_inset.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/conversation-lifecycle.yml'

jobs:
  live-to-final:
    runs-on: ubuntu-latest
    # Same slow-mirror budget as browser-smoke.yml: `playwright install --with-deps`
    # runs apt-get on every job, and on a slow Ubuntu mirror (~25-65 kB/s) the install
    # step alone can run past 10 minutes. On 2026-10-22 the old 10-minute limit cut
    # about 4% of this workflow's jobs, most inside the install step; the two blocking
    # matrix rows below were each cut 14-16 times (census in PR #8494).
    timeout-minutes: 30
    # Keep existing proof rows informational; reconnect + #7676 settle and the
    # #7091 approval first-click regressions fail CI.
    continue-on-error: ${{ matrix.name != 'reconnect-scene-redraw' && matrix.name != 'settle-visibility-7676' && matrix.name != 'approval-first-click' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            script: tests/browser_conversation_lifecycle.py
            scenario: normal
          - name: terminal-error
            script: tests/browser_conversation_lifecycle.py
            scenario: terminal-error
          - name: historical-transcript-hydration
            script: tests/browser_historical_transcript_hydration.py
          - name: virtual-transcript-anchor
            script: tests/browser_virtual_transcript_anchor.py
          - name: reconnect-scene-redraw
            script: tests/browser_reconnect_scene_redraw.py
            browsers: chromium
          # #7676: the settled reply must stay visible in Transparent Stream —
          # real browser, no network interruption, virtualization on/off and
          # both idle-reconcile outcomes. Strict: this is the regression guard
          # for the blank-settled-reply report.
          - name: settle-visibility-7676
            script: tests/browser_settle_visibility_7676.py
            browsers: chromium
          # #7091: the approval card must answer on the FIRST click; a stale
          # transport id is reconciled against the /api/approval/pending head and
          # a click captured on A is never transferred to a queued successor B.
          # Strict: a swallowed failure here would let a cross-approval
          # regression land green.
          - name: approval-first-click
            script: tests/browser_approval_first_click.py
          - name: live-scene-energy
            script: tests/browser_live_scene_energy.py
            browsers: chromium
          - name: progress-animation
            script: tests/browser_progress_animation.py
            browsers: chromium
          - name: running-ring-inset
            script: tests/browser_running_ring_inset.py
            browsers: chromium
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            .github/workflows/conversation-lifecycle.yml

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key on the lockfiles + this workflow: a dependency bump that moves
          # the Playwright version rebuilds the cache instead of replaying a
          # browser tree the installed driver can't launch.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements*.txt', '.github/workflows/conversation-lifecycle.yml') }}

      - name: Install browser gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Run conversation lifecycle gate
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts
          HISTORICAL_HYDRATION_ARTIFACT_DIR: lifecycle-artifacts
          # #8228 greptile P2: the virtual-transcript-anchor gate wrote its
          # screenshot/snapshot/server log to a private temp dir, so a red
          # matrix entry uploaded no evidence. Point it at the one directory
          # the upload step below collects.
          VIRTUAL_ANCHOR_ARTIFACT_DIR: lifecycle-artifacts
          LIFECYCLE_SCENARIO: ${{ matrix.scenario }}
          BROWSERS: ${{ matrix.browsers }}
        run: python ${{ matrix.script }}

      - name: Run settlement frame proof
        if: matrix.scenario == 'normal'
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts
          LIFECYCLE_SCENARIO: normal
          LIFECYCLE_TEST_BITE: settle-worklog-frame-proof
        run: python tests/browser_conversation_lifecycle.py

      - name: Recover a missing terminal frame
        if: matrix.scenario == 'normal'
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts/missing-terminal
          LIFECYCLE_SCENARIO: normal
          LIFECYCLE_TEST_BITE: sidebar-idle-missing-terminal
        run: python tests/browser_conversation_lifecycle.py

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-lifecycle-failure-${{ matrix.name }}
          path: lifecycle-artifacts
          if-no-files-found: ignore
