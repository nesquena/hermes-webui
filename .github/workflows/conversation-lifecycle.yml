name: Conversation lifecycle (informational)

# Scoped to the code this browser gate actually exercises — the chat
# render/streaming surface — so it doesn't spin up playwright+chromium on
# docs-only or unrelated changes. If none of these paths change, the run is
# skipped entirely (GitHub treats a path-filtered no-match as "not triggered").
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'static/**'
      - 'api/**.py'
      - 'server.py'
      - 'tests/browser_conversation_lifecycle.py'
      - 'tests/browser_historical_transcript_hydration.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/conversation-lifecycle.yml'
  push:
    branches: [master]
    paths:
      - 'static/**'
      - 'api/**.py'
      - 'server.py'
      - 'tests/browser_conversation_lifecycle.py'
      - 'tests/browser_historical_transcript_hydration.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/conversation-lifecycle.yml'

jobs:
  live-to-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            script: tests/browser_conversation_lifecycle.py
            scenario: normal
          - name: terminal-error
            script: tests/browser_conversation_lifecycle.py
            scenario: terminal-error
          - name: historical-transcript-hydration
            script: tests/browser_historical_transcript_hydration.py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            .github/workflows/conversation-lifecycle.yml

      - name: Install browser gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Run conversation lifecycle gate
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts
          HISTORICAL_HYDRATION_ARTIFACT_DIR: lifecycle-artifacts
          LIFECYCLE_SCENARIO: ${{ matrix.scenario }}
        run: python ${{ matrix.script }}

      - name: Run settlement frame proof
        if: matrix.scenario == 'normal'
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-artifacts
          LIFECYCLE_SCENARIO: normal
          LIFECYCLE_TEST_BITE: settle-worklog-frame-proof
        run: python tests/browser_conversation_lifecycle.py

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-lifecycle-failure-${{ matrix.name }}
          path: lifecycle-artifacts
          if-no-files-found: ignore

  mutation-canary:
    name: Lifecycle mutation canaries
    needs: live-to-final
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            .github/workflows/conversation-lifecycle.yml

      - name: Install browser gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Verify mutation canaries fail
        env:
          LIFECYCLE_ARTIFACT_DIR: lifecycle-mutation-artifacts
        run: |
          mkdir -p "$LIFECYCLE_ARTIFACT_DIR"

          run_expected_failure() {
            local name="$1"
            local expected_marker="$2"
            shift 2
            local artifact_dir="$LIFECYCLE_ARTIFACT_DIR/$name"
            if [ -e "$artifact_dir" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory already exists"
              return 1
            fi
            mkdir "$artifact_dir"
            local log="$artifact_dir/run.log"
            local expected_gate_failure="CONVERSATION LIFECYCLE GATE FAILED: $expected_marker"

            if [ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory is not empty"
              return 1
            fi

            echo "::group::$name"
            set +e
            LIFECYCLE_ARTIFACT_DIR="$artifact_dir" "$@" 2>&1 | tee "$log"
            local status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "::error title=Mutation survived::$name unexpectedly passed"
              return 1
            fi
            if ! grep -Fxq -- "$expected_marker" "$log" \
              && ! grep -Fxq -- "$expected_gate_failure" "$log"; then
              echo "::error title=Unexpected mutation failure::$name failed without expected marker: $expected_marker"
              tail -200 "$log"
              return 1
            fi
            local classification_prefix
            local classification_marker
            local classification_prefixes=(
              'MUTATION CANARY EXPECTED FAILURE:'
              'NEGATIVE CANARY EXPECTED UNMARKED FAILURE:'
              'NEGATIVE CANARY DISCRIMINATOR:'
              'hermes lifecycle negative canary:'
              'unexpected browser errors'
              'WebUI server exited'
            )
            for classification_prefix in "${classification_prefixes[@]}"; do
              while IFS= read -r classification_marker; do
                if [ "$classification_marker" = "$expected_marker" ] \
                  || [ "$classification_marker" = "$expected_gate_failure" ]; then
                  continue
                fi
                echo "::error title=Competing mutation classification::$name emitted competing marker: $classification_marker"
                tail -200 "$log"
                return 1
              done < <(grep -F -- "$classification_prefix" "$log" || true)
            done
            echo "$name failed as expected with marker: $expected_marker"
          }

          run_unexpected_failure_without_marker() {
            local name="$1"
            local required_marker="$2"
            local forbidden_marker="$3"
            shift 3
            local artifact_dir="$LIFECYCLE_ARTIFACT_DIR/$name"
            if [ -e "$artifact_dir" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory already exists"
              return 1
            fi
            mkdir "$artifact_dir"
            local log="$artifact_dir/run.log"

            if [ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory is not empty"
              return 1
            fi

            echo "::group::$name"
            set +e
            LIFECYCLE_ARTIFACT_DIR="$artifact_dir" "$@" 2>&1 | tee "$log"
            local status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "::error title=Negative canary survived::$name unexpectedly passed"
              return 1
            fi
            if ! grep -Fq -- "$required_marker" "$log"; then
              echo "::error title=Wrong negative failure::$name failed without required marker: $required_marker"
              tail -200 "$log"
              return 1
            fi
            if grep -Fq -- "$forbidden_marker" "$log"; then
              echo "::error title=Over-broad mutation marker::$name emitted forbidden marker: $forbidden_marker"
              tail -200 "$log"
              return 1
            fi
            echo "$name failed without the mutation marker as expected"
          }

          run_unexpected_failure_rejects_marker() {
            local name="$1"
            local required_marker="$2"
            local forbidden_marker="$3"
            local rejected_marker="$4"
            shift 4
            local artifact_dir="$LIFECYCLE_ARTIFACT_DIR/$name"
            if [ -e "$artifact_dir" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory already exists"
              return 1
            fi
            mkdir "$artifact_dir"
            local log="$artifact_dir/run.log"

            if [ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory is not empty"
              return 1
            fi

            echo "::group::$name"
            set +e
            LIFECYCLE_ARTIFACT_DIR="$artifact_dir" "$@" 2>&1 | tee "$log"
            local status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "::error title=Negative canary survived::$name unexpectedly passed"
              return 1
            fi
            if ! grep -Fq -- "$required_marker" "$log"; then
              echo "::error title=Missing injected failure::$name failed without required marker: $required_marker"
              tail -200 "$log"
              return 1
            fi
            local classification_markers=(
              'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload'
              'MUTATION CANARY EXPECTED FAILURE: drop-terminal-anchor-row removed the terminal row from the hard-reloaded Anchor scene'
              'MUTATION CANARY EXPECTED FAILURE: blank-terminal-anchor-status changed the canonical terminal row status before hard reload'
              'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: hard-reload final-text prerequisite failed before Anchor-scene classification'
              'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: Worklog expansion failed after the reloaded Anchor group was present'
            )
            for marker in "${classification_markers[@]}"; do
              if grep -Fq -- "$marker" "$log"; then
                echo "::error title=Over-broad mutation marker::$name emitted forbidden classification marker: $marker"
                tail -200 "$log"
                return 1
              fi
            done
            if grep -Fq -- "$forbidden_marker" "$log" || grep -Fq -- "$rejected_marker" "$log"; then
              echo "::error title=Over-broad mutation marker::$name emitted a forbidden classification marker"
              tail -200 "$log"
              return 1
            fi
            echo "$name rejected both mutation classifications as expected"
          }

          run_guard_knockout() {
            local name="$1"
            local forbidden_marker="$2"
            shift 2
            local artifact_dir="$LIFECYCLE_ARTIFACT_DIR/$name"
            if [ -e "$artifact_dir" ]; then
              echo "::error title=Dirty mutation artifacts::$name artifact directory already exists"
              return 1
            fi
            mkdir "$artifact_dir"
            local log="$artifact_dir/run.log"

            echo "::group::$name"
            set +e
            LIFECYCLE_ARTIFACT_DIR="$artifact_dir" "$@" 2>&1 | tee "$log"
            local status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "::error title=Guard knockout survived::$name unexpectedly passed"
              return 1
            fi
            if grep -Fq -- "$forbidden_marker" "$log" || grep -Fq -- 'NEGATIVE CANARY DISCRIMINATOR:' "$log"; then
              echo "::error title=Guard knockout false-green::$name emitted a discriminator marker"
              tail -200 "$log"
              return 1
            fi
            if ! grep -Fq -- 'did not trigger the shared canary health rejection' "$log"; then
              echo "::error title=Guard knockout unverified::$name did not reach the guard knockout assertion"
              tail -200 "$log"
              return 1
            fi
            echo "$name failed after the shared health guard knockout as expected"
          }

          run_expected_failure normal-anchor-persistence \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            python tests/browser_conversation_lifecycle.py
          run_expected_failure terminal-error-row \
            'MUTATION CANARY EXPECTED FAILURE: drop-terminal-anchor-row removed the terminal row from the hard-reloaded Anchor scene' \
            env LIFECYCLE_SCENARIO=terminal-error \
            LIFECYCLE_TEST_BITE=drop-terminal-anchor-row \
            python tests/browser_conversation_lifecycle.py
          run_expected_failure terminal-error-status \
            'MUTATION CANARY EXPECTED FAILURE: blank-terminal-anchor-status changed the canonical terminal row status before hard reload' \
            env LIFECYCLE_SCENARIO=terminal-error \
            LIFECYCLE_TEST_BITE=blank-terminal-anchor-status \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_without_marker anchor-final-text-prerequisite \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: hard-reload final-text prerequisite failed before Anchor-scene classification' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=fail-reload-final-text \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_without_marker anchor-worklog-expand-prerequisite \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: Worklog expansion failed after the reloaded Anchor group was present' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=throw-reloaded-worklog-expand \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_rejects_marker anchor-worklog-expand-timeout \
            'hermes lifecycle negative canary: unrelated Worklog expansion timeout' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: Worklog expansion failed after the reloaded Anchor group was present' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=timeout-reloaded-worklog-expand \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_rejects_marker final-text-page-close \
            'NEGATIVE CANARY DISCRIMINATOR: page closed before hard-reload final-text prerequisite' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: hard-reload final-text prerequisite failed before Anchor-scene classification' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=close-reload-final-text \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_rejects_marker final-text-server-death \
            'NEGATIVE CANARY DISCRIMINATOR: server died before hard-reload final-text prerequisite' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: hard-reload final-text prerequisite failed before Anchor-scene classification' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=server-death-reload-final-text \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_rejects_marker anchor-group-page-close \
            'NEGATIVE CANARY DISCRIMINATOR: page closed before reloaded Anchor-group classification' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: Worklog expansion failed after the reloaded Anchor group was present' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=close-reloaded-anchor-group \
            python tests/browser_conversation_lifecycle.py
          run_unexpected_failure_rejects_marker anchor-group-server-death \
            'NEGATIVE CANARY DISCRIMINATOR: server died before reloaded Anchor-group classification' \
            'MUTATION CANARY EXPECTED FAILURE: drop-anchor-persistence removed the transcript-backed Anchor scene before hard reload' \
            'NEGATIVE CANARY EXPECTED UNMARKED FAILURE: Worklog expansion failed after the reloaded Anchor group was present' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=server-death-reloaded-anchor-group \
            python tests/browser_conversation_lifecycle.py
          run_guard_knockout final-text-page-close-guard \
            'NEGATIVE CANARY DISCRIMINATOR: page closed before hard-reload final-text prerequisite' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=close-reload-final-text \
            LIFECYCLE_HEALTH_GUARD_KNOCKOUT=page-closed \
            python tests/browser_conversation_lifecycle.py
          run_guard_knockout anchor-group-page-close-guard \
            'NEGATIVE CANARY DISCRIMINATOR: page closed before reloaded Anchor-group classification' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=close-reloaded-anchor-group \
            LIFECYCLE_HEALTH_GUARD_KNOCKOUT=page-closed \
            python tests/browser_conversation_lifecycle.py
          run_guard_knockout final-text-server-guard \
            'NEGATIVE CANARY DISCRIMINATOR: server died before hard-reload final-text prerequisite' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=server-death-reload-final-text \
            LIFECYCLE_HEALTH_GUARD_KNOCKOUT=server-exited \
            python tests/browser_conversation_lifecycle.py
          run_guard_knockout anchor-group-server-guard \
            'NEGATIVE CANARY DISCRIMINATOR: server died before reloaded Anchor-group classification' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=server-death-reloaded-anchor-group \
            LIFECYCLE_HEALTH_GUARD_KNOCKOUT=server-exited \
            python tests/browser_conversation_lifecycle.py
          run_guard_knockout competing-browser-error \
            'NEGATIVE CANARY DISCRIMINATOR: page closed before hard-reload final-text prerequisite' \
            env LIFECYCLE_TEST_BITE=drop-anchor-persistence \
            LIFECYCLE_NEGATIVE_BITE=close-reload-final-text \
            LIFECYCLE_HEALTH_GUARD_KNOCKOUT=page-closed-with-browser-error \
            python tests/browser_conversation_lifecycle.py

      - name: Upload mutation artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-lifecycle-mutation-canary-failure
          path: lifecycle-mutation-artifacts
          if-no-files-found: ignore

  proof-summary:
    name: Lifecycle proof summary
    needs: [live-to-final, mutation-canary]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate result
        env:
          LIFECYCLE_RESULT: ${{ needs.live-to-final.result }}
          MUTATION_RESULT: ${{ needs.mutation-canary.result }}
        run: |
          {
            echo "## Conversation lifecycle proof"
            echo
            echo "| Component | Result |"
            echo "| --- | --- |"
            echo "| Lifecycle rows | $LIFECYCLE_RESULT |"
            echo "| Mutation canaries | $MUTATION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$LIFECYCLE_RESULT" = success
          test "$MUTATION_RESULT" = success
