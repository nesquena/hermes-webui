name: Release & Docker

on:
  push:
    tags:
      - 'v*'
      - 'exp-v*'

jobs:
  # --------------------------------------------------------------------------
  # Backend smoke on the release target OS (Windows) — fast subset only.
  #
  # The full test suite already ran twice before this tag was pushed:
  #   1. Hermes's branch run (Linux, all 21 000+ tests)
  #   2. Muse's merged-tree review (Linux, full suite + lint)
  #
  # Running the whole suite again on windows-latest adds ~25 min and proves
  # nothing new — it re-proves a known result on a slow runner. Instead we
  # run the targeted smoke subset that exercises the three things a release
  # MUST prove on the target OS:
  #
  #   • App import / boot — core modules load without crashing
  #   • API surface — route handlers and health plumbing are present
  #   • Static asset integrity — index.html / sw.js / critical JS exist
  #
  # Timing-budget tests (@pytest.mark.perf) are explicitly excluded: they
  # assert wall-clock elapsed times that are unreliable on virtualised
  # Windows runners. They belong in the Linux CI gate (tests.yml) where
  # they run in every shard. The packaging smoke (packaging/smoke_test.py
  # on a clean unzip) is the end-to-end proof and runs separately.
  # --------------------------------------------------------------------------
  test-smoke-windows:
    name: Backend smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/setup.cfg
            **/requirements*.txt
            **/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-timeout pytest-asyncio

      - name: Run backend smoke subset (not perf)
        # Run only the release smoke file; -m "not perf" is belt-and-suspenders.
        # collect-only count is asserted in the evidence package (see PR body).
        run: |
          pytest tests/test_release_smoke.py -q -m "not perf" --tb=short --timeout=60

  release:
    runs-on: ubuntu-latest
    needs: test-smoke-windows
    permissions:
      contents: write   # required: create GitHub Release
      packages: write   # required: push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Check whether this is a stable or experimental release
      - name: Detect release channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      # Create GitHub Release from tag with auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.is_stable == 'false' }}

      # Set up multi-arch build (QEMU + Buildx)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the git ref (supports vX.Y and vX.Y.Z formats)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(\d+\.\d+(?:\.\d+)?),group=1
            type=match,pattern=exp-v(\d+\.\d+(?:\.\d+)?),group=1
            type=raw,value=latest,enable=${{ steps.channel.outputs.is_stable == 'true' }}
            type=raw,value=experimental,enable=${{ steps.channel.outputs.is_stable == 'false' }}

      # Build and push multi-arch image (amd64 + arm64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HERMES_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
