name: PR 6923 exact streaming boundary fix

on:
  push:
    branches: [fix/media-token-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-token-boundaries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('static/messages.js')
          s = p.read_text()
          old = "if(matchEnd===combined.length && !_smdMediaRefHasReliableBoundary(parts?parts[0]:m[1])){"
          new = "if(matchEnd===combined.length && !_smdMediaRefHasReliableBoundary(m[1])){"
          if s.count(old) != 1:
              raise SystemExit(f'messages target count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_smd_media_in_stream.py')
          s = p.read_text()
          old = '        self.assertIn("!_smdMediaRefHasReliableBoundary(parts?parts[0]:m[1])", block)'
          new = '        self.assertIn("!_smdMediaRefHasReliableBoundary(m[1])", block)'
          if s.count(old) != 1:
              raise SystemExit(f'assert target count={s.count(old)}')
          s = s.replace(old, new, 1)
          marker = '''    def test_remote_query_fragment_trailing_punctuation_is_preserved(self):\n'''
          insert = '''    def test_extension_like_prefix_does_not_complete_before_following_suffix(self):\n        result = _run_media_aware_chunks(["MEDIA:/tmp/a.png.", "bak "])\n        self.assertIn('data-ref="/tmp/a.png.bak"', result["html"])\n        self.assertNotIn('data-ref="/tmp/a.png"', result["html"])\n        self.assertNotIn("MEDIA:", result["text"])\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'marker count={s.count(marker)}')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Focused regression
        run: python -m unittest -q tests.test_smd_media_in_stream
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr6923-apply-stream-boundary-fix.yml
          git add static/messages.js tests/test_smd_media_in_stream.py
          git diff --cached --check
          git commit -m "fix(stream): keep raw media tail buffered until boundary"
          git push origin HEAD:fix/media-token-boundaries
